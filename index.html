<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Note Trainer</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f2eb;
    --bg2: #ede9e0;
    --ink: #1c1a14;
    --ink2: #6b6759;
    --ink3: #706e68;
    --accent: #2d5a3d;
    --accent-light: #e8f0ea;
    --danger: #8b3a2a;
    --danger-light: #f5ece9;
    --border: rgba(28,26,20,0.12);
    --border2: rgba(28,26,20,0.22);
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #18170f;
      --bg2: #221f14;
      --ink: #f0ede4;
      --ink2: #9a9688;
      --ink3: #908e88;
      --accent: #7ab88a;
      --accent-light: #1a2e1f;
      --danger: #c97060;
      --danger-light: #2a1a16;
      --border: rgba(240,237,228,0.1);
      --border2: rgba(240,237,228,0.2);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--ink); font-family: 'DM Mono', monospace; }

  .screen { display: none; min-height: 100vh; }
  .screen.active { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; }

  /* ── Setup screen ── */
  .setup-card {
    background: var(--bg2);
    border: 0.5px solid var(--border2);
    border-radius: 16px;
    padding: 2.5rem;
    max-width: 560px;
    width: 100%;
  }
  .setup-title {
    font-family: 'DM Serif Display', serif;
    font-size: 32px;
    color: var(--ink);
    margin-bottom: 4px;
    line-height: 1.1;
  }
  .setup-sub {
    font-size: 12px;
    color: var(--ink3);
    margin-bottom: 2rem;
    letter-spacing: 0.04em;
  }
  .setup-label {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink3);
    margin-bottom: 8px;
  }
  .clef-options {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 1.5rem;
  }
  .clef-btn {
    padding: 12px 8px;
    border: 0.5px solid var(--border2);
    border-radius: var(--radius);
    background: var(--bg);
    color: var(--ink2);
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
  }
  .clef-btn:hover { border-color: var(--accent); color: var(--ink); }
  .clef-btn.selected {
    background: var(--accent-light);
    border-color: var(--accent);
    color: var(--accent);
  }
  .clef-symbol { font-size: 28px; display: block; margin-bottom: 4px; line-height: 1; }
  .midi-section { margin-bottom: 1.5rem; }
  .midi-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    background: var(--bg);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
  }
  .midi-name { font-size: 12px; color: var(--ink2); }
  .midi-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink3); }
  .midi-dot.on { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    background: var(--bg);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 1.5rem;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .toggle-row:hover { border-color: var(--border2); }
  .toggle-label { font-size: 12px; color: var(--ink2); }
  .toggle-switch {
    width: 32px; height: 18px;
    border-radius: 9px;
    background: var(--border2);
    position: relative;
    transition: background 0.2s;
    flex-shrink: 0;
  }
  .toggle-switch.on { background: var(--accent); }
  .toggle-switch::after {
    content: '';
    position: absolute;
    top: 3px; left: 3px;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: #fff;
    transition: left 0.2s;
  }
  .toggle-switch.on::after { left: 17px; }

  .connect-link {
    font-size: 11px;
    color: var(--accent);
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
    background: none;
    border: none;
    font-family: 'DM Mono', monospace;
    padding: 0;
    margin-top: 6px;
    display: block;
  }
  .start-btn {
    width: 100%;
    padding: 14px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    font-family: 'DM Serif Display', serif;
    font-size: 18px;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
    letter-spacing: 0.02em;
  }
  .start-btn:hover { opacity: 0.9; }
  .start-btn:active { transform: scale(0.99); }
  .start-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ── Game screen ── */
  .game-wrap {
    max-width: 620px;
    width: 100%;
  }
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1.5rem;
  }
  .back-btn {
    font-size: 11px;
    color: var(--ink2);
    background: var(--bg2);
    border: 0.5px solid var(--border2);
    border-radius: 20px;
    cursor: pointer;
    font-family: 'DM Mono', monospace;
    letter-spacing: 0.05em;
    padding: 6px 14px;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .back-btn:hover { border-color: var(--ink3); color: var(--ink); }
  .q-counter {
    font-size: 12px;
    color: var(--ink3);
    letter-spacing: 0.06em;
  }
  .stats {
    display: flex;
    gap: 1.5rem;
  }
  .stat { text-align: right; }
  .stat-n { font-size: 20px; font-weight: 500; color: var(--ink); }
  .stat-l { font-size: 10px; color: var(--ink3); letter-spacing: 0.08em; text-transform: uppercase; }

  .staff-card {
    background: var(--bg2);
    border: 0.5px solid var(--border2);
    border-radius: 14px;
    padding: 2rem 1.5rem 1.5rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 1rem;
    min-height: 240px;
    justify-content: center;
  }
  .clef-tag {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink3);
    margin-bottom: 1.25rem;
  }
  canvas { display: block; max-width: 100%; }
  .reveal-row {
    margin-top: 1.25rem;
    min-height: 28px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .note-name-reveal {
    font-family: 'DM Serif Display', serif;
    font-size: 22px;
    color: var(--ink);
    opacity: 0;
    transition: opacity 0.2s;
  }
  .note-name-reveal.show { opacity: 1; }
  .octave-hint { font-size: 11px; color: var(--ink3); }

  .feedback-bar {
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    letter-spacing: 0.06em;
    border-radius: var(--radius);
    margin-bottom: 0.75rem;
    transition: background 0.2s, color 0.2s;
    color: var(--ink3);
  }
  .feedback-bar.correct { background: var(--accent-light); color: var(--accent); }
  .feedback-bar.wrong { background: var(--danger-light); color: var(--danger); }

  .streak-bar {
    display: flex;
    gap: 5px;
    justify-content: center;
    margin-top: 0.5rem;
  }
  .streak-pip {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--border2);
    transition: background 0.2s;
  }
  .streak-pip.lit { background: var(--accent); }

  .piano-wrap {
    width: 100%;
    max-width: 620px;
    margin-top: 1rem;
    border-radius: 5px;
    overflow: hidden;
    user-select: none;
    position: relative;
    height: 120px;
  }
  .piano-white-keys {
    display: flex;
    width: 100%;
    height: 100%;
  }
  .piano-key-white {
    flex: 1;
    background: #ffffff;
    border-right: 1px solid #a8a49a;
    border-radius: 0 0 3px 3px;
    position: relative;
    cursor: pointer;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 5px;
    box-sizing: border-box;
    transition: background 0.08s;
  }
  .piano-key-white:last-child { border-right: none; }
  .piano-key-white .pk-label {
    font-family: 'DM Mono', monospace;
    font-size: clamp(9px, 2.2cqw, 18px);
    color: #3a3830;
    pointer-events: none;
    line-height: 1;
  }
  .piano-key-white.pk-active  { background: #2d5a3d; }
  .piano-key-white.pk-active .pk-label { color: rgba(255,255,255,0.85); }
  .piano-key-white.pk-wrong   { background: #c0392b; }
  .piano-key-white.pk-wrong .pk-label  { color: rgba(255,255,255,0.85); }

  .piano-black-keys {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .piano-key-black {
    position: absolute;
    top: 0;
    width: 10%;          /* overridden inline */
    height: 62%;
    background: #1c1a14;
    border-radius: 0 0 3px 3px;
    cursor: pointer;
    pointer-events: all;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    padding-bottom: 4px;
    box-sizing: border-box;
    gap: 1px;
    transition: background 0.08s;
  }
  .piano-key-black .pk-label {
    font-family: 'DM Mono', monospace;
    font-size: clamp(7px, 1.6cqw, 11px);
    color: rgba(255,255,255,0.85);
    pointer-events: none;
    line-height: 1.1;
    text-align: center;
  }
  .piano-key-black.pk-active  { background: #2d5a3d; }
  .piano-key-black.pk-wrong   { background: #c0392b; }

  @media (prefers-color-scheme: dark) {
    .piano-key-white            { background: #e8e4d8; border-color: #b8b4a8; }
    .piano-key-white .pk-label  { color: #2a2818; }
    .piano-key-white.pk-active  { background: #7ab88a; }
    .piano-key-black            { background: #0a0906; }
    .piano-key-black.pk-active  { background: #7ab88a; }
    .piano-key-black.pk-wrong   { background: #c97060; }
    .piano-key-white.pk-wrong   { background: #c97060; }
  }

  /* ── Summary screen ── */
  .summary-score {
    text-align: center;
    padding: 1.75rem 0 1.25rem;
  }
  .summary-big {
    font-family: 'DM Serif Display', serif;
    font-size: 58px;
    color: var(--ink);
    display: block;
    line-height: 1;
    margin-bottom: 6px;
  }
  .summary-unit {
    font-size: 11px;
    color: var(--ink3);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .summary-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: var(--border);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    margin-bottom: 1.5rem;
  }
  .summary-stat {
    text-align: center;
    padding: 14px 8px;
    background: var(--bg);
  }
  .summary-btn-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .secondary-btn {
    padding: 13px;
    background: var(--bg);
    color: var(--ink2);
    border: 0.5px solid var(--border2);
    border-radius: var(--radius);
    font-family: 'DM Serif Display', serif;
    font-size: 16px;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.02em;
  }
  .secondary-btn:hover { border-color: var(--ink3); color: var(--ink); }

  /* ── Count picker (reuses clef-btn styles) ── */
  .count-options {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 1.5rem;
  }
  .count-options .clef-btn { font-size: 15px; padding: 10px 8px; }

  /* ── Responsive ── */
  @media (max-width: 600px) {
    .screen.active          { padding: 1rem; gap: 0; }
    .setup-card             { padding: 1.5rem 1.25rem; }
    .setup-title            { font-size: 26px; }
    .setup-sub              { margin-bottom: 1.25rem; }
    .clef-options,
    .count-options          { margin-bottom: 1.25rem; }
    .midi-section           { margin-bottom: 1.25rem; }
    .toggle-row             { margin-bottom: 1rem; padding: 9px 12px; }
    .staff-card             { padding: 1.25rem 1rem 1rem; min-height: 200px; }
    .top-bar                { margin-bottom: 1rem; }
    .piano-wrap             { margin-top: 0.75rem; }
    .summary-score          { padding: 1.25rem 0 0.75rem; }
    .summary-big            { font-size: 44px; }
  }
</style>
</head>
<body>

<!-- Setup Screen -->
<div class="screen active" id="screen-setup">
  <div class="setup-card">
    <h1 class="setup-title">Note<br>Trainer</h1>
    <p class="setup-sub">sight reading · staff drill</p>

    <p class="setup-label">Clef</p>
    <div class="clef-options">
      <button class="clef-btn selected" id="clef-treble" onclick="selectClef('treble')">
        <span class="clef-symbol">𝄞</span>treble
      </button>
      <button class="clef-btn" id="clef-bass" onclick="selectClef('bass')">
        <span class="clef-symbol">𝄢</span>bass
      </button>
      <button class="clef-btn" id="clef-both" onclick="selectClef('both')">
        <span class="clef-symbol">𝄞𝄢</span>both
      </button>
    </div>

    <p class="setup-label">Questions</p>
    <div class="count-options">
      <button class="clef-btn" id="count-5"   onclick="selectCount(5)">5</button>
      <button class="clef-btn selected" id="count-10"  onclick="selectCount(10)">10</button>
      <button class="clef-btn" id="count-20"  onclick="selectCount(20)">20</button>
      <button class="clef-btn" id="count-inf" onclick="selectCount(null)">∞</button>
    </div>

    <div class="toggle-row" onclick="toggleAccidentals()">
      <span class="toggle-label">sharps &amp; flats</span>
      <span class="toggle-switch" id="acc-toggle"></span>
    </div>

    <p class="setup-label">MIDI keyboard</p>
    <div class="midi-section">
      <div class="midi-row">
        <span class="midi-name" id="midi-name">not connected</span>
        <span class="midi-dot" id="midi-dot"></span>
      </div>
      <button class="connect-link" onclick="connectMidi()">connect keyboard →</button>
    </div>

    <div class="toggle-row" id="octave-row" style="display:none" onclick="toggleOctave()">
      <span class="toggle-label">match octave</span>
      <span class="toggle-switch" id="octave-toggle"></span>
    </div>

    <button class="start-btn" id="start-btn" onclick="startGame()">start →</button>
  </div>
</div>

<!-- Game Screen -->
<div class="screen" id="screen-game">
  <div class="game-wrap">
    <div class="top-bar">
      <button class="back-btn" onclick="goBack()">← back</button>
      <span class="q-counter" id="q-counter"></span>
      <div class="stats">
        <div class="stat">
          <div class="stat-n" id="s-streak">0</div>
          <div class="stat-l">streak</div>
        </div>
        <div class="stat">
          <div class="stat-n" id="s-correct">0</div>
          <div class="stat-l">correct</div>
        </div>
        <div class="stat">
          <div class="stat-n" id="s-wrong">0</div>
          <div class="stat-l">wrong</div>
        </div>
      </div>
    </div>

    <div class="staff-card">
      <p class="clef-tag" id="clef-tag">bass clef</p>
      <canvas id="staff"></canvas>
      <div class="reveal-row">
        <span class="note-name-reveal" id="note-reveal"></span>
        <span class="octave-hint" id="octave-hint"></span>
      </div>
    </div>

    <div class="feedback-bar" id="feedback">play the note shown above</div>

    <div class="streak-bar" id="streak-bar">
      <!-- 10 pips -->
    </div>

  </div>
  <div class="piano-wrap" id="piano">
    <div class="piano-white-keys">
      <div class="piano-key-white" data-pc="0"><span class="pk-label">C</span></div>
      <div class="piano-key-white" data-pc="2"><span class="pk-label">D</span></div>
      <div class="piano-key-white" data-pc="4"><span class="pk-label">E</span></div>
      <div class="piano-key-white" data-pc="5"><span class="pk-label">F</span></div>
      <div class="piano-key-white" data-pc="7"><span class="pk-label">G</span></div>
      <div class="piano-key-white" data-pc="9"><span class="pk-label">A</span></div>
      <div class="piano-key-white" data-pc="11"><span class="pk-label">B</span></div>
    </div>
    <div class="piano-black-keys">
      <div class="piano-key-black" data-pc="1"  data-label="C♯/D♭" style="left:calc(1/7*100% - 5%);width:10%;"><span class="pk-label">C♯</span><span class="pk-label">D♭</span></div>
      <div class="piano-key-black" data-pc="3"  data-label="D♯/E♭" style="left:calc(2/7*100% - 5%);width:10%;"><span class="pk-label">D♯</span><span class="pk-label">E♭</span></div>
      <div class="piano-key-black" data-pc="6"  data-label="F♯/G♭" style="left:calc(4/7*100% - 5%);width:10%;"><span class="pk-label">F♯</span><span class="pk-label">G♭</span></div>
      <div class="piano-key-black" data-pc="8"  data-label="G♯/A♭" style="left:calc(5/7*100% - 5%);width:10%;"><span class="pk-label">G♯</span><span class="pk-label">A♭</span></div>
      <div class="piano-key-black" data-pc="10" data-label="A♯/B♭" style="left:calc(6/7*100% - 5%);width:10%;"><span class="pk-label">A♯</span><span class="pk-label">B♭</span></div>
    </div>
  </div>
</div>

<!-- Summary Screen -->
<div class="screen" id="screen-summary">
  <div class="setup-card">
    <p class="setup-sub" style="margin-bottom:0">session complete</p>
    <div class="summary-score">
      <span class="summary-big" id="sum-score">—</span>
      <span class="summary-unit" id="sum-pct"></span>
    </div>
    <div class="summary-stats">
      <div class="summary-stat">
        <div class="stat-n" id="sum-correct">0</div>
        <div class="stat-l">correct</div>
      </div>
      <div class="summary-stat">
        <div class="stat-n" id="sum-wrong">0</div>
        <div class="stat-l">wrong</div>
      </div>
      <div class="summary-stat">
        <div class="stat-n" id="sum-streak">0</div>
        <div class="stat-l">best streak</div>
      </div>
    </div>
    <div class="summary-btn-row">
      <button class="secondary-btn" onclick="goBack()">← menu</button>
      <button class="start-btn" onclick="playAgain()">play again →</button>
    </div>
  </div>
</div>

<script>
// ── Note data ──────────────────────────────────────────────
const BASS = [
  {name:'G2',midi:43,pos:1},   // bottom line
  {name:'A2',midi:45,pos:1.5},
  {name:'B2',midi:47,pos:2},
  {name:'C3',midi:48,pos:2.5},
  {name:'D3',midi:50,pos:3},   // middle line
  {name:'E3',midi:52,pos:3.5},
  {name:'F3',midi:53,pos:4},
  {name:'G3',midi:55,pos:4.5},
  {name:'A3',midi:57,pos:5},   // top line
  {name:'B3',midi:59,pos:5.5},
  {name:'C4',midi:60,pos:6},   // middle C, first ledger above
];
const TREBLE = [
  {name:'C4',midi:60,pos:0},   // middle C, ledger below
  {name:'D4',midi:62,pos:0.5},
  {name:'E4',midi:64,pos:1},   // bottom line
  {name:'F4',midi:65,pos:1.5},
  {name:'G4',midi:67,pos:2},
  {name:'A4',midi:69,pos:2.5},
  {name:'B4',midi:71,pos:3},
  {name:'C5',midi:72,pos:3.5},
  {name:'D5',midi:74,pos:4},
  {name:'E5',midi:76,pos:4.5},
  {name:'F5',midi:77,pos:5},   // top line
];

// ── Accidental note data ────────────────────────────────────
// Sharps sit on the natural note they sharpen (G# on the G line)
const BASS_ACC = [
  {name:'G#2',midi:44,pos:1,  acc:'#'},
  {name:'A#2',midi:46,pos:1.5,acc:'#'},
  {name:'C#3',midi:49,pos:2.5,acc:'#'},
  {name:'D#3',midi:51,pos:3,  acc:'#'},
  {name:'F#3',midi:54,pos:4,  acc:'#'},
  {name:'G#3',midi:56,pos:4.5,acc:'#'},
  {name:'A#3',midi:58,pos:5,  acc:'#'},
];
const TREBLE_ACC = [
  {name:'C#4',midi:61,pos:0,  acc:'#'},
  {name:'D#4',midi:63,pos:0.5,acc:'#'},
  {name:'F#4',midi:66,pos:1.5,acc:'#'},
  {name:'G#4',midi:68,pos:2,  acc:'#'},
  {name:'A#4',midi:70,pos:2.5,acc:'#'},
  {name:'C#5',midi:73,pos:3.5,acc:'#'},
  {name:'D#5',midi:75,pos:4,  acc:'#'},
];
// Flats sit on the natural note they flatten (Ab on the A line) — same midi, different position
const BASS_FLAT = [
  {name:'Ab2',midi:44,pos:1.5,acc:'b'},
  {name:'Bb2',midi:46,pos:2,  acc:'b'},
  {name:'Db3',midi:49,pos:3,  acc:'b'},
  {name:'Eb3',midi:51,pos:3.5,acc:'b'},
  {name:'Gb3',midi:54,pos:4.5,acc:'b'},
  {name:'Ab3',midi:56,pos:5,  acc:'b'},
  {name:'Bb3',midi:58,pos:5.5,acc:'b'},
];
const TREBLE_FLAT = [
  {name:'Db4',midi:61,pos:0.5,acc:'b'},
  {name:'Eb4',midi:63,pos:1,  acc:'b'},
  {name:'Gb4',midi:66,pos:2,  acc:'b'},
  {name:'Ab4',midi:68,pos:2.5,acc:'b'},
  {name:'Bb4',midi:70,pos:3,  acc:'b'},
  {name:'Db5',midi:73,pos:4,  acc:'b'},
  {name:'Eb5',midi:75,pos:4.5,acc:'b'},
];

// ── State ──────────────────────────────────────────────────
let clefMode = 'treble';
let enforceOctave = false;
let includeAccidentals = false;
let questionLimit = 10;
let midiConnected = false;
let currentNote = null;
let correct = 0, wrong = 0, streak = 0, questionCount = 0, bestStreak = 0;
let waitingForNext = false;
let lastPlayedPc = -1;
let audioCtx = null;

// ── Setup ──────────────────────────────────────────────────
function toggleOctave() {
  enforceOctave = !enforceOctave;
  document.getElementById('octave-toggle').classList.toggle('on', enforceOctave);
}

function toggleAccidentals() {
  includeAccidentals = !includeAccidentals;
  document.getElementById('acc-toggle').classList.toggle('on', includeAccidentals);
}

function selectCount(n) {
  questionLimit = n;
  const opts = [5, 10, 20, null];
  opts.forEach(v => {
    const el = document.getElementById('count-' + (v === null ? 'inf' : v));
    if (el) el.classList.toggle('selected', v === n);
  });
}

function selectClef(c) {
  clefMode = c;
  ['treble','bass','both'].forEach(x =>
    document.getElementById('clef-'+x).classList.toggle('selected', x===c)
  );
}

async function connectMidi(silent = false) {
  if (!navigator.requestMIDIAccess) {
    if (!silent) document.getElementById('midi-name').textContent = 'not supported in this browser';
    return;
  }
  if (silent && navigator.permissions) {
    try {
      const perm = await navigator.permissions.query({ name: 'midi', sysex: false });
      if (perm.state !== 'granted') return;
    } catch(e) { /* permissions API unavailable, fall through */ }
  }
  try {
    const access = await navigator.requestMIDIAccess();
    const inputs = [...access.inputs.values()];
    if (!inputs.length) {
      if (!silent) document.getElementById('midi-name').textContent = 'no devices found — plug in first';
      return;
    }
    inputs.forEach(i => i.onmidimessage = onMidi);
    midiConnected = true;
    document.getElementById('midi-name').textContent = inputs[0].name || 'keyboard connected';
    document.getElementById('midi-dot').classList.add('on');
    document.getElementById('octave-row').style.display = '';
  } catch(e) {
    if (!silent) document.getElementById('midi-name').textContent = 'access denied';
  }
}

function startGame() {
  correct = 0; wrong = 0; streak = 0; questionCount = 0; bestStreak = 0;
  updateStats();
  buildStreakPips();
  const qc = document.getElementById('q-counter');
  qc.textContent = questionLimit ? '0 / ' + questionLimit : '';
  showScreen('game');
  nextNote();
}

function playAgain() {
  startGame();
}

function handleButtonPress(pitchClass, label) {
  if (!currentNote || waitingForNext) return;
  if (currentNote.midi % 12 === pitchClass) {
    handleCorrect();
  } else {
    lastPlayedPc = pitchClass;
    handleWrong(label);
  }
}

// ── Piano ───────────────────────────────────────────────────
const WHITE_PC    = [0, 2, 4, 5, 7, 9, 11];
const WHITE_LABEL = ['C','D','E','F','G','A','B'];
const BLACK_OFFSET = [1, 2, 4, 5, 6]; // center on the boundary between each pair of white keys
const BLACK_PC     = [1, 3, 6, 8, 10];
const BLACK_LABEL  = ['C♯','D♯','F♯','G♯','A♯'];
const BLACK_LABEL2 = ['D♭','E♭','G♭','A♭','B♭'];

function drawPiano(activePc = -1, wrongPc = -1) {
  document.querySelectorAll('.piano-key-white, .piano-key-black').forEach(el => {
    const pc = parseInt(el.dataset.pc, 10);
    el.classList.toggle('pk-active', pc === activePc);
    el.classList.toggle('pk-wrong',  pc === wrongPc);
  });
}

function pianoClickHandler(e) {
  const key = e.target.closest('.piano-key-white, .piano-key-black');
  if (!key) return;
  const pc = parseInt(key.dataset.pc, 10);
  const label = key.dataset.label || key.querySelector('.pk-label').textContent;
  drawPiano(pc);
  handleButtonPress(pc, label);
}

function goBack() {
  currentNote = null;
  waitingForNext = false;
  showScreen('setup');
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-'+id).classList.add('active');
}

// ── Game ───────────────────────────────────────────────────
function getPool() {
  if (clefMode === 'treble') {
    return includeAccidentals ? [...TREBLE, ...TREBLE_ACC, ...TREBLE_FLAT] : TREBLE;
  }
  if (clefMode === 'bass') {
    return includeAccidentals ? [...BASS, ...BASS_ACC, ...BASS_FLAT] : BASS;
  }
  const bassNotes = BASS.filter(n => n.name !== 'C4');
  if (includeAccidentals) {
    return [...bassNotes, ...BASS_ACC, ...BASS_FLAT, ...TREBLE, ...TREBLE_ACC, ...TREBLE_FLAT];
  }
  return [...bassNotes, ...TREBLE];
}

function nextNote() {
  waitingForNext = false;
  const pool = getPool();
  let n;
  do { n = pool[Math.floor(Math.random() * pool.length)]; }
  while (pool.length > 1 && n === currentNote);
  currentNote = n;

  const isBass = BASS.includes(n) || BASS_ACC.includes(n) || BASS_FLAT.includes(n);
  document.getElementById('clef-tag').textContent = isBass ? 'bass clef' : 'treble clef';
  drawNote(n, isBass);
  drawPiano();

  document.getElementById('note-reveal').classList.remove('show');
  document.getElementById('note-reveal').textContent = '';
  document.getElementById('octave-hint').textContent = '';
  setFeedback('play the note shown above', '');
}

function onMidi(event) {
  const [status, note, velocity] = event.data;
  if ((status & 0xf0) !== 0x90 || velocity === 0) return;

  // Free play on setup screen — just audition the note
  if (!document.getElementById('screen-game').classList.contains('active')) {
    playTone(note, true);
    return;
  }

  // Light up the key on the piano
  drawPiano(note % 12);

  if (!currentNote || waitingForNext) return;

  const isCorrect = enforceOctave
    ? note === currentNote.midi
    : midiNoteName(note) === midiNoteName(currentNote.midi);
  const playedLabel = enforceOctave ? midiFullName(note) : midiNoteName(note);

  if (isCorrect) {
    handleCorrect();
  } else {
    lastPlayedPc = note % 12;
    handleWrong(playedLabel);
  }
}

function midiNoteName(midi) {
  return ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'][midi % 12];
}

function midiFullName(midi) {
  const letter = midiNoteName(midi);
  const octave = Math.floor(midi / 12) - 1;
  return letter + octave;
}

function handleCorrect() {
  correct++;
  streak++;
  questionCount++;
  if (streak > bestStreak) bestStreak = streak;
  updateStats();
  revealNote();
  playTone(currentNote.midi, true);
  setFeedback('✓ correct', 'correct');
  waitingForNext = true;
  const done = questionLimit && questionCount >= questionLimit;
  setTimeout(done ? showSummary : nextNote, 1100);
}

function handleWrong(played) {
  wrong++;
  streak = 0;
  questionCount++;
  updateStats();
  revealNote();
  playWrongSound();
  setFeedback('✗  you played ' + played + ' — this is ' + currentNote.name, 'wrong');
  waitingForNext = true;

  // Visual feedback: wrong key red, correct key flickers green
  const correctPc = currentNote.midi % 12;
  const wpc = lastPlayedPc;
  drawPiano(correctPc, wpc);
  setTimeout(() => drawPiano(-1, wpc),        300);
  setTimeout(() => drawPiano(correctPc, wpc), 600);
  setTimeout(() => drawPiano(-1, wpc),        900);
  setTimeout(() => drawPiano(correctPc, wpc), 1200);

  const done = questionLimit && questionCount >= questionLimit;
  setTimeout(done ? showSummary : nextNote, 1800);
}

function showSummary() {
  currentNote = null;
  waitingForNext = false;
  const total = correct + wrong;
  const pct = total ? Math.round(correct / total * 100) : 0;
  document.getElementById('sum-score').textContent = correct + ' / ' + total;
  document.getElementById('sum-pct').textContent = pct + '% correct';
  document.getElementById('sum-correct').textContent = correct;
  document.getElementById('sum-wrong').textContent = wrong;
  document.getElementById('sum-streak').textContent = bestStreak;
  showScreen('summary');
}

function revealNote() {
  const el = document.getElementById('note-reveal');
  el.textContent = currentNote.name;
  el.classList.add('show');
  document.getElementById('octave-hint').textContent = '';
}

function setFeedback(msg, cls) {
  const el = document.getElementById('feedback');
  el.textContent = msg;
  el.className = 'feedback-bar ' + cls;
}

function updateStats() {
  document.getElementById('s-correct').textContent = correct;
  document.getElementById('s-wrong').textContent = wrong;
  document.getElementById('s-streak').textContent = streak;
  if (questionLimit) {
    document.getElementById('q-counter').textContent = questionCount + ' / ' + questionLimit;
  }
  updatePips();
}

function buildStreakPips() {
  const bar = document.getElementById('streak-bar');
  bar.innerHTML = '';
  for (let i = 0; i < 10; i++) {
    const d = document.createElement('div');
    d.className = 'streak-pip';
    d.id = 'pip-'+i;
    bar.appendChild(d);
  }
}

function updatePips() {
  for (let i = 0; i < 10; i++) {
    const p = document.getElementById('pip-'+i);
    if (p) p.classList.toggle('lit', i < streak);
  }
}

// ── Audio ─────────────────────────────────────────────────
function playWrongSound() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const t = audioCtx.currentTime;
    // Two descending "duh duh" notes — E4 then C#4 (minor third), sawtooth for buzz
    [[110, 0], [92.5, 0.19]].forEach(([freq, delay]) => {
      const osc  = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(freq, t + delay);
      gain.gain.setValueAtTime(0.11, t + delay);
      gain.gain.exponentialRampToValueAtTime(0.001, t + delay + 0.22);
      osc.start(t + delay);
      osc.stop(t + delay + 0.23);
    });
  } catch(e) {}
}

function playTone(midi, correct) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const freq = 440 * Math.pow(2, (midi - 69) / 12);
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (correct ? 0.9 : 0.3));
    osc.start(audioCtx.currentTime);
    osc.stop(audioCtx.currentTime + (correct ? 0.9 : 0.3));
  } catch(e) {}
}

// ── Staff drawing ──────────────────────────────────────────
function drawNote(note, isBass) {
  const canvas = document.getElementById('staff');

  // Size canvas to fill the staff-card's inner width
  const card = canvas.closest('.staff-card');
  const style = getComputedStyle(card);
  const innerW = card.clientWidth
    - parseFloat(style.paddingLeft)
    - parseFloat(style.paddingRight);
  const W = Math.max(innerW, 160);
  const s = W / 300; // scale factor relative to 300px base design
  const H = Math.round(150 * s);
  canvas.width = W;
  canvas.height = H;

  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, W, H);

  const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const ink = dark ? '#f0ede4' : '#1c1a14';

  const staffTop = 32 * s;
  const ls     = 13 * s;
  const left   = 62 * s;
  const w      = 196 * s;
  const bottomLine = staffTop + 4 * ls;
  const noteX  = left + w / 2 + 14 * s;
  const rx = 7 * s, ry = 5.5 * s;

  // Staff lines — same color as notes/clef
  ctx.strokeStyle = ink;
  ctx.lineWidth = 0.8 * s;
  for (let i = 0; i < 5; i++) {
    ctx.beginPath();
    ctx.moveTo(left, staffTop + i * ls);
    ctx.lineTo(left + w, staffTop + i * ls);
    ctx.stroke();
  }

  // Clef
  ctx.fillStyle = ink;
  if (isBass) {
    ctx.font = `${Math.round(46 * s)}px serif`;
    ctx.fillText('𝄢', left - 46 * s, staffTop + 34 * s);
  } else {
    ctx.font = `${Math.round(62 * s)}px serif`;
    ctx.fillText('𝄞', left - 42 * s, staffTop + 50 * s);
  }

  // Note Y position (pos 1 = bottom line, pos 5 = top line)
  const noteY = bottomLine - (note.pos - 1) * ls;

  // Ledger lines
  ctx.lineWidth = 1 * s;
  if (note.pos <= 0.5) {
    ctx.beginPath();
    ctx.moveTo(noteX - rx - 5 * s, bottomLine + ls);
    ctx.lineTo(noteX + rx + 5 * s, bottomLine + ls);
    ctx.stroke();
  }
  if (note.pos >= 6) {
    ctx.beginPath();
    ctx.moveTo(noteX - rx - 5 * s, staffTop - ls);
    ctx.lineTo(noteX + rx + 5 * s, staffTop - ls);
    ctx.stroke();
  }

  // Accidental (sharp/flat) to the left of note head
  if (note.acc) {
    const accChar = note.acc === '#' ? '♯' : '♭';
    ctx.font = `bold ${Math.round(15 * s)}px serif`;
    ctx.fillStyle = ink;
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.fillText(accChar, noteX - rx - 3 * s, noteY);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
  }

  // Note head
  ctx.beginPath();
  ctx.ellipse(noteX, noteY, rx, ry, -0.15, 0, Math.PI * 2);
  ctx.fillStyle = ink;
  ctx.fill();

  // Stem
  const stemDir = note.pos < 3 ? -1 : 1;
  const stemX = stemDir === 1 ? noteX - rx + 1 * s : noteX + rx - 1 * s;
  ctx.beginPath();
  ctx.strokeStyle = ink;
  ctx.lineWidth = 1.4 * s;
  ctx.moveTo(stemX, noteY);
  ctx.lineTo(stemX, noteY + stemDir * ls * 3.2);
  ctx.stroke();
}

// ── Init ───────────────────────────────────────────────────
function redrawCurrent() {
  if (currentNote) {
    drawNote(currentNote, BASS.includes(currentNote) || BASS_ACC.includes(currentNote) || BASS_FLAT.includes(currentNote));
    drawPiano();
  }
}
window.addEventListener('resize', redrawCurrent);

document.getElementById('piano').addEventListener('click', pianoClickHandler);
// resize listener no longer needs to redraw the piano (CSS handles layout)

buildStreakPips();
connectMidi(true); // auto-connect on load if permission already granted
</script>
